description: 'Hand-authored (injected) bug: the new `getLast(T[] array)` method loops with `for (int i
  = 0; i <= array.length; i++)`, using `<=` instead of `<`. On the final iteration `i` equals `array.length`,
  which is one past the last valid index, so `array[i]` throws `ArrayIndexOutOfBoundsException` for every
  non-empty array. Classic off-by-one loop bound.'
