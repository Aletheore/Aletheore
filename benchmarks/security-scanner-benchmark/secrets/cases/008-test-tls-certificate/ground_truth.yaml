case_id: 008-test-tls-certificate
scanner: secrets
category: true_negative
expected_pattern: private_key_header
expected_path: tests/fixtures/key.pem
expected_line: 1
expected_likely_placeholder: true
description: >
  A committed PEM private key at a test-suggestive path (tests/fixtures/),
  the same real shape found in axios's and gin's own repos during this
  benchmark's real-repo validation run (both were committed TLS test
  certificates, not leaked credentials). Should be reported but flagged
  likely_placeholder - a PEM header's entropy can never cross the
  low-entropy threshold on its own, so path is the only usable signal
  for this pattern (see src/aletheore/secrets.py's _is_likely_placeholder).
