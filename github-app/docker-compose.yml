services:
  app-server:
    build:
      context: ..
      dockerfile: github-app/Dockerfile.app-server
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/github-app-key.pem
    volumes:
      - ./app-private-key.pem:/run/secrets/github-app-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    cpus: "1.0"
    mem_limit: 768m

  scan-worker:
    build:
      context: ..
      dockerfile: github-app/Dockerfile.scan-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/github-app-key.pem
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./app-private-key.pem:/run/secrets/github-app-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
    cpus: "1.0"
    mem_limit: 1g

  # Never started via `up` - this service exists purely so `docker compose
  # build demo-sandbox` produces the aletheore-demo-sandbox:latest image on
  # the host daemon for demo-scan-worker (which has docker socket access)
  # to `docker run --runtime=runsc` on demand, one ephemeral container per
  # live website demo request.
  demo-sandbox:
    build:
      context: ..
      dockerfile: github-app/Dockerfile.demo-sandbox
    image: aletheore-demo-sandbox:latest
    profiles: ["build-only"]

  demo-scan-worker:
    build:
      context: ..
      dockerfile: github-app/Dockerfile.demo-scan-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # The only service with the host's Docker socket - deliberately gets
    # no DB credentials, no GitHub App key, no LLM keys (see
    # Dockerfile.demo-scan-worker). Only consumes the demo_scan queue,
    # completely separate from paying customers' real scan/audit jobs.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_started
    cpus: "1.0"
    mem_limit: 512m

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=aletheore_app
      - POSTGRES_USER=aletheore
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - aletheore_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aletheore -d aletheore_app"]
      interval: 2s
      timeout: 3s
      retries: 20

  scheduler:
    build:
      context: ..
      dockerfile: github-app/Dockerfile.scan-worker
    restart: unless-stopped
    command: ["python", "-m", "scan_worker.scheduler"]
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Tried OLLAMA_CONTEXT_LENGTH=8192 here first, assuming nomic-embed-text
    # supports an 8192-token context - it doesn't, not on the GGUF this
    # pulls: confirmed directly against the running server that the model's
    # own trained context is a hard 2048, and requesting more just logged
    # "requested context size too large for model" and got silently
    # clamped back down. The real fix is keeping input within that limit
    # (see MAX_EMBEDDING_CHARS in scan_worker/embedding_client.py), not a
    # server setting that can't raise a ceiling the model itself doesn't have.
    volumes:
      - aletheore_ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 3
        ollama pull nomic-embed-text
        wait
    cpus: "1.0"
    mem_limit: 1g

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - aletheore_caddy_data:/data
      - aletheore_caddy_config:/config
    depends_on:
      - app-server

volumes:
  aletheore_postgres_data:
  aletheore_ollama_data:
  aletheore_caddy_data:
  aletheore_caddy_config:
