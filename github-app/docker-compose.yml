services:
  app-server:
    build:
      context: ..
      dockerfile: github-app/Dockerfile.app-server
    restart: unless-stopped
    labels:
      - autoheal=true
    # `restart: unless-stopped` only reacts to the process actually
    # exiting - it did nothing to help an import-time crash-loop earlier
    # (correctly kept restarting it, since the process really did exit
    # each time) but would do nothing at all for a process that's still
    # running but hung. This HEALTHCHECK plus the autoheal service below
    # closes that gap: any container Docker reports unhealthy for
    # AUTOHEAL_START_PERIOD gets `docker restart`ed automatically. Uses
    # Python's stdlib rather than adding curl to the image.
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    env_file:
      - path: .env
        required: false
    environment:
      - GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/github-app-key.pem
      - JINA_EMBED_BASE_URL=http://jina-embed:80
    volumes:
      - ./app-private-key.pem:/run/secrets/github-app-key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      jina-embed:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    cpus: "1.0"
    mem_limit: 768m
    # Own Python code, not a third-party image whose internal capability
    # needs are unaudited - it does nothing (no raw sockets, no chroot, no
    # binding a privileged <1024 port) that needs any Linux capability, so
    # dropping all of them costs nothing here. no-new-privileges blocks a
    # setuid/setgid binary or file capability from ever escalating this
    # process further than it started, regardless of what capabilities it
    # does hold. pids_limit is generous, not tuned to today's usage - a
    # ceiling against a fork-bomb-shaped failure, not a throttle.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    pids_limit: 512

  scan-worker:
    build:
      context: ..
      dockerfile: github-app/Dockerfile.scan-worker
    restart: unless-stopped
    labels:
      - autoheal=true
    # No HTTP server here (RQ worker) - see app_server/heartbeat.py. A
    # background thread touches /tmp/heartbeat every ~30s; this fails once
    # that file goes stale, e.g. the process is hung. See app-server's
    # healthcheck comment above for why this matters beyond `restart:
    # unless-stopped` alone.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file:
      - path: .env
        required: false
    environment:
      - GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/github-app-key.pem
      - JINA_EMBED_BASE_URL=http://jina-embed:80
      - ALETHEORE_REPO_CHECKOUT_ROOT=/data/aletheore-repo-checkouts
      - ALETHEORE_APP_HEALTH_URL=http://app-server:8000/healthz
      - ALETHEORE_BACKUP_DIR=/app/backups
    volumes:
      - ./app-private-key.pem:/run/secrets/github-app-key.pem:ro
      # Persistent, reused-across-scans per-repo checkouts (see
      # scan_worker/jobs.py's _ensure_persistent_checkout) - without a real
      # mounted volume here, this would live inside the container's
      # writable layer and vanish on every redeploy, making every scan a
      # cold, first-time scan again. Falls back to an ephemeral clone
      # automatically if this ever isn't writable (see
      # _prepare_head_checkout), so a misconfigured or full mount degrades
      # to today's behavior rather than failing scans outright.
      - ./repo-checkouts:/data/aletheore-repo-checkouts
      # Host-level backup-postgres.sh writes here; the ops monitor reads it
      # read-only from the scan worker to alert if dumps go missing/stale.
      - ./backups:/app/backups:ro
    tmpfs:
      - /tmp:size=1g,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      jina-embed:
        condition: service_healthy
    cpus: "1.0"
    mem_limit: 1g
    # See app-server's identical block above for the reasoning. Higher
    # pids_limit than the other services here specifically: a scan
    # legitimately spawns many concurrent subprocesses (git, tree-sitter
    # parsing via Popen streaming, dependency-vulnerability checks).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    pids_limit: 1024

  # Second replica of scan-worker, consuming the same "scans" queue. RQ's
  # own job dequeue is already safe for multiple workers (atomic claim via
  # Redis) - the one thing that WASN'T safe for two replicas was
  # _ensure_persistent_checkout's unlocked use of the shared
  # ./repo-checkouts bind mount (two replicas racing `git checkout -f`/
  # `git clean -fdx` on the same working tree, or racing the live-token
  # `git remote set-url` around it). repo_checkout_lock (scan_worker/db.py)
  # closes that: same-repo jobs across replicas now serialize via a
  # Postgres advisory lock instead of racing, while different repos (the
  # actual point of a second replica) genuinely run in parallel. Otherwise
  # identical to scan-worker above - keep both blocks in sync.
  scan-worker-2:
    build:
      context: ..
      dockerfile: github-app/Dockerfile.scan-worker
    restart: unless-stopped
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file:
      - path: .env
        required: false
    environment:
      - GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/github-app-key.pem
      - JINA_EMBED_BASE_URL=http://jina-embed:80
      - ALETHEORE_REPO_CHECKOUT_ROOT=/data/aletheore-repo-checkouts
      - ALETHEORE_APP_HEALTH_URL=http://app-server:8000/healthz
      - ALETHEORE_BACKUP_DIR=/app/backups
    volumes:
      - ./app-private-key.pem:/run/secrets/github-app-key.pem:ro
      - ./repo-checkouts:/data/aletheore-repo-checkouts
      - ./backups:/app/backups:ro
    tmpfs:
      - /tmp:size=1g,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      jina-embed:
        condition: service_healthy
    cpus: "1.0"
    mem_limit: 1g
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    pids_limit: 1024

  # Consumes the "health" and "email" queues (see scan_worker/scheduler.py
  # and health_worker.py) - a dedicated worker so a long-running AI job on
  # scan-worker's "scans" queue (Flash review, AIRview, managed audit) can
  # never delay the ~3-minute endpoint health sweep, or a time-sensitive
  # transactional email, behind it. Same image as scan-worker since
  # run_health_check_sweep_job's failure-alert enrichment needs the same
  # GitHub App credentials and LLM keys; RESEND_API_KEY comes from the
  # same env_file. No jina-embed or persistent repo-checkout volume since
  # neither health checks nor email sends do embeddings or local git work.
  health-worker:
    build:
      context: ..
      dockerfile: github-app/Dockerfile.scan-worker
    restart: unless-stopped
    labels:
      - autoheal=true
    # See scan-worker's healthcheck comment above - same mechanism, this
    # container's own /tmp/heartbeat, checked independently.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: ["python", "-m", "scan_worker.health_worker"]
    env_file:
      - path: .env
        required: false
    environment:
      - GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/github-app-key.pem
    volumes:
      - ./app-private-key.pem:/run/secrets/github-app-key.pem:ro
    tmpfs:
      - /tmp:size=512m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    cpus: "0.5"
    mem_limit: 512m
    # See app-server's identical block above for the reasoning.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    pids_limit: 512

  # Never started via `up` - this service exists purely so `docker compose
  # build demo-sandbox` produces the aletheore-demo-sandbox:latest image on
  # the host daemon for demo-scan-worker (which has docker socket access)
  # to `docker run --runtime=runsc` on demand, one ephemeral container per
  # live website demo request.
  demo-sandbox:
    build:
      context: ..
      dockerfile: github-app/Dockerfile.demo-sandbox
    image: aletheore-demo-sandbox:latest
    profiles: ["build-only"]

  demo-scan-worker:
    build:
      context: ..
      dockerfile: github-app/Dockerfile.demo-scan-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - DEMO_SANDBOX_RUNNER_URL=http://demo-sandbox-runner:8090
    # No Docker socket here - see Dockerfile.demo-scan-worker and
    # scan_worker/demo_scan.py. Deliberately gets no DB credentials, no
    # GitHub App key, no LLM keys either. Only consumes the demo_scan
    # queue, completely separate from paying customers' real scan/audit
    # jobs.
    depends_on:
      redis:
        condition: service_started
      demo-sandbox-runner:
        condition: service_started
    cpus: "1.0"
    mem_limit: 512m
    # See app-server's identical block above for the reasoning.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    pids_limit: 512

  demo-sandbox-runner:
    build:
      context: ..
      dockerfile: github-app/Dockerfile.demo-sandbox-runner
    restart: unless-stopped
    # The only service with the host's Docker socket. Exposes exactly one
    # internal-only operation (see scan_worker/demo_sandbox_runner.py) -
    # "run this repo_url through the fixed sandbox command" - built
    # entirely server-side from a validated repo_url, not a proxied
    # Docker API. A tecnativa/docker-socket-proxy-style method/path
    # allowlist was tested directly against this same daemon and does
    # NOT close this: with only CONTAINERS+POST enabled, `docker run -v
    # /:/hostfs alpine ls /hostfs` still succeeded, since POST=1
    # (required for `docker run` to work at all) already allows an
    # arbitrary bind mount in the request body. No host port published -
    # only reachable from other containers on this compose network.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    cpus: "1.0"
    mem_limit: 256m
    # See app-server's identical block above for the reasoning - talking to
    # the mounted Docker socket is Unix-socket file-permission-based, not
    # gated by this container's own Linux capabilities, so dropping them
    # doesn't affect the one thing this service does.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    pids_limit: 256

  postgres:
    image: postgres:16
    restart: unless-stopped
    command: postgres -c shared_buffers=1GB -c max_wal_size=4GB
    environment:
      - POSTGRES_DB=aletheore_app
      - POSTGRES_USER=aletheore
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - aletheore_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aletheore -d aletheore_app"]
      interval: 2s
      timeout: 3s
      retries: 20
    # Third-party image - unlike the services above, its exact capability
    # needs (CHOWN/SETUID/SETGID/DAC_OVERRIDE during initdb, at minimum)
    # aren't ours to assert without a dedicated per-image audit, so only
    # the always-safe directive is added here: no-new-privileges never
    # removes a capability the container already has, it only blocks
    # gaining new ones via a setuid/setgid binary or file capability.
    security_opt:
      - "no-new-privileges:true"

  scheduler:
    build:
      context: ..
      dockerfile: github-app/Dockerfile.scan-worker
    restart: unless-stopped
    labels:
      - autoheal=true
    # touch_heartbeat() runs at the end of every completed loop iteration
    # (scan_worker/scheduler.py) - a stronger signal than the RQ workers'
    # background-thread heartbeat, since it only updates once the whole
    # enqueue batch (including the Redis calls that stopped working for 11
    # days without anyone noticing) actually succeeds. 180s iteration
    # interval, so a wider window than the RQ workers' 30s thread tick.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -6 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    command: ["python", "-m", "scan_worker.scheduler"]
    env_file:
      - path: .env
        required: false
    environment:
      - GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/github-app-key.pem
    volumes:
      - ./app-private-key.pem:/run/secrets/github-app-key.pem:ro
    depends_on:
      redis:
        condition: service_started
    # See app-server's identical block above for the reasoning.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    pids_limit: 512

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Internal-only, no privileged port, no setuid/capability-bearing
    # binary involved in starting redis-server - safe with no risk to the
    # public-facing path (see caddy below for the one image this was
    # deliberately NOT added to).
    security_opt:
      - "no-new-privileges:true"

  # Replaced Ollama+nomic-embed-text here (see PR history) after a real,
  # corrected 6-language retrieval benchmark showed jina-embeddings-v2-
  # base-code beating nomic on every metric (75.0/93.1/95.8% vs
  # 73.6/87.5/91.7% top-1/3/5 pooled) while bge-m3 actually underperformed
  # nomic - jina was the only code-specific model tested, which tracks.
  # Model weights are baked into the image at build time (see
  # Dockerfile.jina-embed), so no persistent volume is needed here the way
  # Ollama needed one for its pulled model - a fresh container already has
  # the weights.
  jina-embed:
    build:
      context: ..
      dockerfile: github-app/Dockerfile.jina-embed
    restart: unless-stopped
    # Internal-only (port 80, never published to the host) - same
    # reasoning as redis above.
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:80/healthz', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      # Model load happens at import time, before uvicorn starts accepting
      # connections at all - generous start_period so a slow cold start on
      # a busy host doesn't get flagged unhealthy before it's had a chance.
      start_period: 60s
    environment:
      # Passed straight through to llama.cpp's n_threads (divided across
      # instances - see JINA_EMBED_INSTANCES below). Must match `cpus`
      # below - the 24.55s/2-thread real-batch measurement server.py's
      # docstring cites was made at this exact thread count, not a larger
      # one this box's 4 cores could technically support.
      - JINA_EMBED_THREADS=2
      # 2 instances x 1 thread each, not 1 instance x 2 threads. Measured
      # locally (10-core/8GB Docker, 4 concurrent streams of real thrift
      # source, --cpus=2 both configurations): 2x1 finished in 223.27s
      # against 1x2's 238.83s, ~6.5% faster on identical total CPU. The
      # mechanism isn't more compute - the container's thread budget is
      # unchanged either way - it's that a single instance parallelizing
      # one call across threads pays real synchronization overhead inside
      # llama.cpp's matmul kernels, while N single-threaded instances
      # processing N requests pay none of that. It also reduces queueing
      # delay under concurrent load specifically: today every caller (two
      # scan-worker replicas, demo-scan-worker, hosted index builds) queues
      # behind one locked instance even when their requests are otherwise
      # fully independent - this exact queueing was part of what pushed a
      # thrift-scale request past the 60s embeddings_api timeout at the old
      # HOSTED_EMBED_MAX_CHARS (see search_index.py's comment on that cap).
      - JINA_EMBED_INSTANCES=2
    # Bumped from 1.0. This service is the only CPU-bound one in the stack -
    # everything else is I/O-bound on Postgres, Redis or the GitHub API -
    # and at 1.0 it was the hard ceiling on hosted indexing: measured at a
    # flat ~340 characters/second, so `aletheore index` on even a small repo
    # (jq, 780 chunks) could not finish a single batch inside the 60s
    # timeout embeddings_api gives it, returned 502, and silently fell back
    # to the local embedder on every attempt. The hosted embeddings feature
    # was therefore never actually exercised in production.
    #
    # 2.0 and not more: the host has **4 cores** (nproc), carrying a baseline
    # load average of ~0.9. `cpus` is a limit rather than a reservation, so a
    # higher number would not fail outright - it would let one sustained index
    # build occupy the whole machine and starve app-server, which serves live
    # webhooks and the dashboard. Half the box is the most this can take while
    # a customer-facing request path shares it. If measurement shows 2.0 is
    # still the ceiling on usable hosted indexing, the answer is a dedicated
    # host for this service, not a bigger share of this one.
    cpus: "2.0"
    # 6000m was sized for the old sentence-transformers/PyTorch backend,
    # which OOM-killed at ~2.44GB on a 133k-char real-code batch even after
    # being raised from 2500m (see git history). This backend is llama.cpp
    # against a Q8_0 GGUF quantization instead - measured directly on this
    # host, the identical 133k-char real flask batch peaked at 375MB, not
    # 2.44GB+. 2000m keeps ~5x headroom over that single-request peak for
    # concurrent requests sharing the process (endpoints are sync `def`s,
    # so FastAPI's threadpool can run more than one at once) without
    # carrying forward a limit sized for a backend this image no longer
    # runs. Not concurrency-load-tested; a further reduction should be too.
    mem_limit: 2000m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Deliberately NOT given no-new-privileges here, unlike every other
    # service in this file: this is the one process binding privileged
    # ports 80/443, and depending on exactly how the official image starts
    # the caddy binary (root directly vs. a non-root user relying on a
    # CAP_NET_BIND_SERVICE file capability), no_new_privs can suppress
    # that capability grant at exec time and break the public HTTPS
    # termination for the entire product. Confirming which case applies
    # and testing it live is real follow-up work, not something to guess
    # at on the one container an outage here is most visible through.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - aletheore_caddy_data:/data
      - aletheore_caddy_config:/config
    depends_on:
      - app-server

  # `docker restart`s any container labeled autoheal=true that Docker
  # reports unhealthy for AUTOHEAL_START_PERIOD. `restart: unless-stopped`
  # alone only reacts to a container actually exiting - nothing in this
  # stack detected a process that's still running but stuck, which is the
  # likely shape of the failure that let the health-check sweep go silent
  # for 11 days without anyone noticing. willfarrell/autoheal: a small,
  # widely-used, single-purpose image - just watches the Docker socket, no
  # code of ours to maintain here.
  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_INTERVAL=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # No published port, no privileged-port binding - safe for the same
    # reason as redis/jina-embed above.
    security_opt:
      - "no-new-privileges:true"

volumes:
  aletheore_postgres_data:
  aletheore_caddy_data:
  aletheore_caddy_config:
