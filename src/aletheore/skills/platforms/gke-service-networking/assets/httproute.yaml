---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-route # Replace with your HTTPRoute name
  namespace: default # Replace with your namespace
spec:
  parentRefs:
    - name: my-gateway # Replace with the Gateway name it attaches to
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: my-service # Replace with your Service name
          port: 80
