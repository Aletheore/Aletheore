apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
  namespace: my-app # Replace with your namespace
  labels:
    app: node-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Matches the `node` user (uid/gid 1000) set via USER in the Dockerfile
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: node-app
        # Replace with your actual Artifact Registry image path and real digest,
        # e.g., us-docker.pkg.dev/<PROJECT_ID>/<REPO>/node-app@sha256:<DIGEST>
        image: us-docker.pkg.dev/my-project/my-repo/node-app@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: node-app-service
  namespace: my-app # Replace with your namespace
spec:
  selector:
    app: node-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  # ClusterIP for internal access; for external exposure use the Gateway API —
  # see the gke-service-networking skill
  type: ClusterIP
