rules:
  - id: java-runtime-exec-command-injection
    languages: [java]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      confidence: MEDIUM
      references:
        - https://owasp.org/www-community/attacks/Command_Injection
    message: >
      Review the variable command or executable '$COMMAND'. If untrusted input
      controls it, Runtime.exec/ProcessBuilder can execute an attacker-chosen
      program. Prefer a fixed executable with separately validated arguments.
      This structural check does not prove input provenance or allowlist safety.
    pattern-either:
      # Scalar overloads: only the command/executable position matters. A fixed
      # executable followed by a variable ordinary argument is not a finding.
      - patterns:
          - pattern-either:
              - pattern: Runtime.getRuntime().exec((String $COMMAND), ...)
              - pattern: Runtime.getRuntime().exec((java.lang.String $COMMAND), ...)
              - pattern: java.lang.Runtime.getRuntime().exec((String $COMMAND), ...)
              - pattern: java.lang.Runtime.getRuntime().exec((java.lang.String $COMMAND), ...)
              - pattern: (Runtime $RUNTIME).exec((String $COMMAND), ...)
              - pattern: (Runtime $RUNTIME).exec((java.lang.String $COMMAND), ...)
              - pattern: (java.lang.Runtime $RUNTIME).exec((String $COMMAND), ...)
              - pattern: (java.lang.Runtime $RUNTIME).exec((java.lang.String $COMMAND), ...)
              - pattern: new ProcessBuilder((String $COMMAND), ...)
              - pattern: new ProcessBuilder((java.lang.String $COMMAND), ...)
              - pattern: new java.lang.ProcessBuilder((String $COMMAND), ...)
              - pattern: new java.lang.ProcessBuilder((java.lang.String $COMMAND), ...)
              - pattern: (ProcessBuilder $BUILDER).command((String $COMMAND), ...)
              - pattern: (ProcessBuilder $BUILDER).command((java.lang.String $COMMAND), ...)
              - pattern: (java.lang.ProcessBuilder $BUILDER).command((String $COMMAND), ...)
              - pattern: (java.lang.ProcessBuilder $BUILDER).command((java.lang.String $COMMAND), ...)
          - metavariable-pattern:
              metavariable: $COMMAND
              patterns:
                - pattern: $VALUE
                - pattern-not: '"..."'
                - pattern-not: $LEFT + $RIGHT
      # String concatenations are common command construction, but Semgrep's
      # shallow type inference need not label the whole expression as String.
      - patterns:
          - pattern-either:
              - pattern: Runtime.getRuntime().exec($COMMAND, ...)
              - pattern: java.lang.Runtime.getRuntime().exec($COMMAND, ...)
              - pattern: (Runtime $RUNTIME).exec($COMMAND, ...)
              - pattern: (java.lang.Runtime $RUNTIME).exec($COMMAND, ...)
              - pattern: new ProcessBuilder($COMMAND, ...)
              - pattern: new java.lang.ProcessBuilder($COMMAND, ...)
              - pattern: (ProcessBuilder $BUILDER).command($COMMAND, ...)
              - pattern: (java.lang.ProcessBuilder $BUILDER).command($COMMAND, ...)
          - metavariable-pattern:
              metavariable: $COMMAND
              patterns:
                - pattern: $LEFT + $RIGHT
                - pattern-not: '"..."'
      # Inline arrays expose the executable directly. Do not flag an ordinary
      # variable argument elsewhere in an array whose first element is fixed.
      - patterns:
          - pattern-either:
              - pattern: Runtime.getRuntime().exec(new String[] { $COMMAND, ... }, ...)
              - pattern: Runtime.getRuntime().exec(new java.lang.String[] { $COMMAND, ... }, ...)
              - pattern: java.lang.Runtime.getRuntime().exec(new String[] { $COMMAND, ... }, ...)
              - pattern: java.lang.Runtime.getRuntime().exec(new java.lang.String[] { $COMMAND, ... }, ...)
              - pattern: (Runtime $RUNTIME).exec(new String[] { $COMMAND, ... }, ...)
              - pattern: (Runtime $RUNTIME).exec(new java.lang.String[] { $COMMAND, ... }, ...)
              - pattern: (java.lang.Runtime $RUNTIME).exec(new String[] { $COMMAND, ... }, ...)
              - pattern: (java.lang.Runtime $RUNTIME).exec(new java.lang.String[] { $COMMAND, ... }, ...)
              - pattern: new ProcessBuilder(new String[] { $COMMAND, ... })
              - pattern: new ProcessBuilder(new java.lang.String[] { $COMMAND, ... })
              - pattern: new java.lang.ProcessBuilder(new String[] { $COMMAND, ... })
              - pattern: new java.lang.ProcessBuilder(new java.lang.String[] { $COMMAND, ... })
              - pattern: (ProcessBuilder $BUILDER).command(new String[] { $COMMAND, ... })
              - pattern: (ProcessBuilder $BUILDER).command(new java.lang.String[] { $COMMAND, ... })
              - pattern: (java.lang.ProcessBuilder $BUILDER).command(new String[] { $COMMAND, ... })
              - pattern: (java.lang.ProcessBuilder $BUILDER).command(new java.lang.String[] { $COMMAND, ... })
          - metavariable-pattern:
              metavariable: $COMMAND
              patterns:
                - pattern: $VALUE
                - pattern-not: '"..."'
      # A whole command array supplied as a method parameter has an unknown
      # executable. Local array/list aliases and interprocedural flows are
      # outside this rule's scope; they need dataflow analysis.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $RETURN $METHOD(..., String[] $COMMAND, ...) { ... }
              - pattern-inside: |
                  $RETURN $METHOD(..., java.lang.String[] $COMMAND, ...) { ... }
          - pattern-either:
              - pattern: Runtime.getRuntime().exec($COMMAND, ...)
              - pattern: java.lang.Runtime.getRuntime().exec($COMMAND, ...)
              - pattern: (Runtime $RUNTIME).exec($COMMAND, ...)
              - pattern: (java.lang.Runtime $RUNTIME).exec($COMMAND, ...)
              - pattern: new ProcessBuilder($COMMAND)
              - pattern: new java.lang.ProcessBuilder($COMMAND)
              - pattern: (ProcessBuilder $BUILDER).command($COMMAND)
              - pattern: (java.lang.ProcessBuilder $BUILDER).command($COMMAND)
    paths:
      exclude:
        - "**/*Test.java"
        - "**/*Tests.java"
        - "**/Test*.java"
        - "**/test/**"
        - "**/tests/**"
