name: OpenSSF Scorecard

on:
  branch_protection_rule:
  push:
    branches:
      - master
  schedule:
    # Scores the repo's current state, not a diff - weekly catches drift
    # (a dependency going unmaintained, an action losing its pin) between
    # pushes to master, which can otherwise go quiet for a while.
    - cron: "30 1 * * 6"

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload the SARIF results to the Security tab
      id-token: write # to publish results to the public Scorecard API
      actions: read # only needed on private repos, harmless to keep here

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Public repo, public score - what makes the badge on the README
          # live instead of a local-only report nobody but this CI job sees.
          publish_results: true

      - name: Upload SARIF results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 14

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: results.sarif
