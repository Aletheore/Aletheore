name: Container Security

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  security-events: write

jobs:
  image-scan:
    name: Image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app-server
            dockerfile: github-app/Dockerfile.app-server
            tag: aletheore-app-server:ci
          - image: scan-worker
            dockerfile: github-app/Dockerfile.scan-worker
            tag: aletheore-scan-worker:ci
          - image: jina-embed
            dockerfile: github-app/Dockerfile.jina-embed
            tag: aletheore-jina-embed:ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: docker build -f "${{ matrix.dockerfile }}" -t "${{ matrix.tag }}" .

      - name: Scan image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Enforce image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif

  sbom:
    name: SBOM (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app-server
            dockerfile: github-app/Dockerfile.app-server
            tag: aletheore-app-server:ci
          - image: scan-worker
            dockerfile: github-app/Dockerfile.scan-worker
            tag: aletheore-scan-worker:ci
          - image: jina-embed
            dockerfile: github-app/Dockerfile.jina-embed
            tag: aletheore-jina-embed:ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: docker build -f "${{ matrix.dockerfile }}" -t "${{ matrix.tag }}" .

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.tag }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.spdx.json
          retention-days: 30
