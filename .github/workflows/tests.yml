name: Tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC, so Codecov upload below needs no stored token
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        working-directory: src
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: src
        run: >
          pytest --cov=aletheore --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-src-py${{ matrix.python-version }}
          path: src/coverage.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: src/coverage.xml
          flags: cli-py${{ matrix.python-version }}
          fail_ci_if_error: false
