name: Tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC, so Codecov upload below needs no stored token
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        working-directory: src
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: src
        run: >
          pytest --cov=aletheore --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-src-py${{ matrix.python-version }}
          path: src/coverage.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: src/coverage.xml
          flags: cli-py${{ matrix.python-version }}
          fail_ci_if_error: false

  # Runs the CLI tests on Windows, with the runner's real default locale. Every other job
  # in this repo runs on Linux, which is how a whole class of bug (file I/O and subprocess
  # text encoding falling back to the Windows codepage, fixed in #790) went unseen: Linux
  # and macOS default to UTF-8, Windows does not.
  #
  # Do NOT set PYTHONUTF8 or PYTHONIOENCODING here - that would force UTF-8 and hide
  # exactly the bugs this job exists to catch.
  #
  # A separate job rather than an `os` matrix axis on `pytest` above, so the existing
  # `pytest (3.11)` / `pytest (3.12)` check names stay exactly as they are. The coverage
  # gate is left off: its 85% threshold was calibrated on Linux, and platform-specific
  # code paths would make it a false signal here.
  pytest-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install
        working-directory: src
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: src
        run: pytest
