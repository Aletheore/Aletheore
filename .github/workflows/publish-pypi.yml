name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC) - no PyPI token stored anywhere
      attestations: write # build provenance for the release artifacts below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build
        working-directory: src
        run: |
          pip install build
          python -m build

      - name: Attest build provenance
        # Same OIDC identity as the trusted-publishing step below - a
        # verifiable, signed record of exactly which workflow run and
        # source commit produced these artifacts (SLSA provenance), so
        # a downloaded wheel/sdist can be checked with `gh attestation
        # verify` instead of trusted on faith.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "src/dist/*"

      - name: Publish to PyPI
        # Pinned to a commit SHA rather than the release/v1 branch - this
        # step runs with an OIDC trusted-publishing token scoped to PyPI
        # uploads, so a compromised upstream branch would mean silently
        # supply-chain-tampered releases to every aletheore user. v1.14.2.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: src/dist
