name: Council

on:
  pull_request:
    paths:
      - "src/aletheore/council/**"
      - "src/tests/council/**"
      - "council/**"
      - "src/pyproject.toml"
      - ".github/workflows/council.yml"
  push:
    branches:
      - master
    paths:
      - "src/aletheore/council/**"
      - "src/tests/council/**"
      - "council/**"
      - "src/pyproject.toml"

permissions:
  contents: read

env:
  ALETHEORE_CRASH_REPORTING: "0"

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        working-directory: src
        run: pip install -e ".[dev,council]"

      - name: Run Council tests
        working-directory: src
        run: pytest tests/council --timeout=300

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the Council site
        working-directory: council/site
        run: node check.mjs
