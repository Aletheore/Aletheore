<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="224" viewBox="0 0 1120 224" role="img" aria-labelledby="title desc"><title id="title">From source code to a source-grounded PR review</title><desc id="desc">Scan a repository, inspect evidence, query it through a coding agent, then review changes in GitHub.</desc><rect width="1120" height="224" rx="16" fill="#111318"/><text x="28" y="33" fill="#f2a45f" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">ONE EVIDENCE LAYER. EVERY STEP.</text><rect x="24" y="54" width="244" height="146" rx="10" fill="#1c2028" stroke="#343a46"/><text x="42" y="82" fill="#f2a45f" font-family="Arial,sans-serif" font-size="12">01</text><text x="230" y="83" fill="#f2a45f" font-family="monospace" font-size="18" text-anchor="middle">&gt;_</text><text x="42" y="125" fill="#ffffff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Scan</text><text x="42" y="158" fill="#b8c0ce" font-family="Arial,sans-serif" font-size="13">Read source + Git history</text><path d="M275 126h18m-5-5 5 5-5 5" fill="none" stroke="#f2a45f" stroke-width="2"/><rect x="300" y="54" width="244" height="146" rx="10" fill="#1c2028" stroke="#343a46"/><text x="318" y="82" fill="#f2a45f" font-family="Arial,sans-serif" font-size="12">02</text><text x="506" y="83" fill="#f2a45f" font-family="monospace" font-size="18" text-anchor="middle">⋈</text><text x="318" y="125" fill="#ffffff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Evidence graph</text><text x="318" y="158" fill="#b8c0ce" font-family="Arial,sans-serif" font-size="13">Trace imports + ownership</text><path d="M551 126h18m-5-5 5 5-5 5" fill="none" stroke="#f2a45f" stroke-width="2"/><rect x="576" y="54" width="244" height="146" rx="10" fill="#1c2028" stroke="#343a46"/><text x="594" y="82" fill="#f2a45f" font-family="Arial,sans-serif" font-size="12">03</text><text x="782" y="83" fill="#f2a45f" font-family="monospace" font-size="18" text-anchor="middle">{ }</text><text x="594" y="125" fill="#ffffff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Coding agent</text><text x="594" y="158" fill="#b8c0ce" font-family="Arial,sans-serif" font-size="13">Query context through MCP</text><path d="M827 126h18m-5-5 5 5-5 5" fill="none" stroke="#f2a45f" stroke-width="2"/><rect x="852" y="54" width="244" height="146" rx="10" fill="#1c2028" stroke="#343a46"/><text x="870" y="82" fill="#f2a45f" font-family="Arial,sans-serif" font-size="12">04</text><text x="1058" y="83" fill="#f2a45f" font-family="monospace" font-size="18" text-anchor="middle">✓</text><text x="870" y="125" fill="#ffffff" font-family="Arial,sans-serif" font-size="23" font-weight="700">PR review</text><text x="870" y="158" fill="#b8c0ce" font-family="Arial,sans-serif" font-size="13">Inspect source-cited findings</text></svg>